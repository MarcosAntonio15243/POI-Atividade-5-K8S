apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-bound
  namespace: atividade5
spec:
  replicas: 2
  selector:
    matchLabels: { app: cpu-bound }
  template:
    metadata:
      labels: { app: cpu-bound }
    spec:
      containers:
      - name: cpu-bound
        image: cpu-bound:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests: { cpu: 250m, memory: 128Mi }
          limits:   { cpu: "1", memory: 256Mi }
        readinessProbe:
          httpGet: { path: "/matriz?tamanho=2", port: 8000 }
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: { path: "/matriz?tamanho=2", port: 8000 }
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-bound
  namespace: atividade5
spec:
  type: NodePort
  selector: { app: cpu-bound }
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30001
