apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-bound
  namespace: atividade5
spec:
  replicas: 1
  selector:
    matchLabels: { app: memory-bound }
  template:
    metadata:
      labels: { app: memory-bound }
    spec:
      containers:
      - name: memory-bound
        image: memory-bound:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: "1", memory: 768Mi }
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: memory-bound
  namespace: atividade5
spec:
  type: NodePort
  selector: { app: memory-bound }
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30002
