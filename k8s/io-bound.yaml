apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-bound
  namespace: atividade5
spec:
  replicas: 1
  selector:
    matchLabels: { app: io-bound }
  template:
    metadata:
      labels: { app: io-bound }
    spec:
      containers:
      - name: io-bound
        image: io-bound:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8095
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 256Mi }
        readinessProbe:
          httpGet: { path: /, port: 8095 }
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: { path: /, port: 8095 }
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: io-bound
  namespace: atividade5
spec:
  type: NodePort
  selector: { app: io-bound }
  ports:
  - port: 8095
    targetPort: 8095
    nodePort: 30003
